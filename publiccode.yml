description:
  de:
    genericName: Geoinformationsanwendung
    shortDescription: >
      Browsertool zum Anzeigen, Verändern und neu Setzen der Aufnahmeposition
      und Orientierung von Bildern.
    longDescription: |
      **Webanwendung:** [kreis-viersen.usercontent.opencode.de/fotostandort](https://kreis-viersen.usercontent.opencode.de/fotostandort)
    
      Fotostandort ist eine browserbasierte Kartenanwendung zum Anzeigen,
      Verändern und Setzen der Aufnahmeposition und Orientierung von Bildern.
      Vorhandene Positions- und Richtungsinformationen werden aus den EXIF-Daten
      eines ausgewählten Bildes ausgelesen und auf einer interaktiven Karte
      dargestellt.

      Die Aufnahmeposition wird durch einen Marker visualisiert und kann direkt
      in der Karte per Drag-and-Drop verändert werden. Die Orientierung der
      Aufnahme kann optional über einen Sichtkegel angezeigt und durch freies
      Drehen verändert werden. Im Informationsbereich werden die ursprünglich im
      Bild enthaltenen Werte den neu gesetzten Werten gegenübergestellt.

      Bilder ohne vorhandene Positions- oder Orientierungsinformationen können
      ebenfalls bearbeitet und mit entsprechenden Informationen versehen werden.
      Bilder, die nicht im JPEG-Format vorliegen, werden innerhalb der Anwendung
      in das JPEG-Format konvertiert.

      Als Hintergrundkarten stehen OpenStreetMap sowie aktuelle Luftbilder von
      Geobasis NRW zur Verfügung. Die Anwendung ist für die Nutzung auf
      Desktop-Rechnern ebenso wie auf mobilen Geräten ausgelegt.

      Die Verarbeitung der ausgewählten Bilder erfolgt vollständig lokal im
      Webbrowser. Die Bilder werden nicht zur Verarbeitung auf einen Server
      übertragen. Nach Abschluss der Bearbeitung kann das Bild mit den
      aktualisierten EXIF-Informationen lokal gespeichert werden.
    features:
      - >-
        Darstellung der Aufnahmeposition und -orientierung eines Bildes auf
        einer interaktiven Karte
      - >-
        Intuitives Verändern oder neu Setzen der Aufnahmeposition und
        -orientierung
      - Gegenüberstellung der ursprünglichen und neu gesetzten Werte
      - >-
        Speichern des Bildes mit den neu gesetzten Positions- und
        Orientierungsdaten
      - Auswahl verschiedener Hintergrundkarten
      - Konvertierung unterstützter Bildformate in das JPEG-Format
      - Lokale Verarbeitung der Bilder ohne Upload auf einen Server
      - Bedienung auf Desktop- und mobilen Geräten
    screenshots:
      - screenshots/screenshot_082026.png
